# ArgoCD Application — Apache Airflow
# 적용: kubectl apply -f argocd/application-airflow.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: "1.21.0"
      helm:
        valueFiles:
          - $values/airflow/values.yaml
    - repoURL: https://github.com/dannykil/kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
