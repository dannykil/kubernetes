# ArgoCD Application — 클러스터 인프라 (Kubernetes Dashboard + Ingress-nginx)
# kind-config.yaml은 쿠버네티스 리소스가 아니므로 제외
# 적용: kubectl apply -f argocd/application-infra.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/dannykil/kubernetes.git
    path: kubernetes
    targetRevision: main
    directory:
      exclude: "kind-config.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # 자동 동기화를 켜 두면 GitHub main 의 LoadBalancer Service 가 다시 들어온다.
  # kind 는 그 Service 에 외부 주소를 주지 않아 sync 가 Progressing 에서 끝나지 않는다.
  # scripts/cluster.sh 가 로컬 kubernetes/ingress-nginx-kind.yaml 을 직접 적용한다.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: kubernetes-dashboard-csrf
      namespace: kubernetes-dashboard
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: kubernetes-dashboard-key-holder
      namespace: kubernetes-dashboard
      jsonPointers:
        - /data
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
