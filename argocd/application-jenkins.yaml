# ArgoCD Application — Jenkins
# 적용: kubectl apply -f argocd/application-jenkins.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: "*"
    helm:
      valueFiles:
        - https://raw.githubusercontent.com/dannykil/kubernetes/main/jenkins/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
