# ArgoCD Application — PostgreSQL (공유 DB)
# Bitnami Helm 대신 공식 postgres:16-alpine 이미지로 배포 (Docker Hub bitnami 이미지 삭제 대응)
# sync-wave: storageclass(-2) → pv(-1) → pvc와 statefulset(1)
# postgres-local 은 WaitForFirstConsumer 다. PVC만 먼저 만들면 Pending에서 끝나고
# StatefulSet 이 적용되지 않는다. PVC와 StatefulSet 은 같은 wave 여야 한다.
# 적용: kubectl apply -f argocd/application-postgres.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/dannykil/kubernetes.git
    path: postgres
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
