# ArgoCD Application — PostgreSQL (공유 DB)
# storageclass → pv → pvc → postgresql 순서로 sync-wave 적용
# 적용: kubectl apply -f argocd/application-postgres.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/dannykil/kubernetes.git
    path: postgres
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: postgresql

      helm:
        valueFiles:
          - $values/postgres/values.yaml
    - repoURL: https://github.com/dannykil/kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
