# ArgoCD Application — Redis Stack (Redis + RedisInsight)
# 적용: kubectl apply -f argocd/application-redis.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/dannykil/kubernetes.git
    path: redis
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
