# ArgoCD Application — Apache Superset
# 적용: kubectl apply -f argocd/application-superset.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://apache.github.io/superset
      chart: superset
      targetRevision: "0.15.5"
      helm:
        valueFiles:
          - $values/superset/superset-values-dev.yaml
    - repoURL: https://github.com/dannykil/kubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: superset
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
