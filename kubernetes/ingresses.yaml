# 로컬 서비스 Ingress 모음
# 접속 전 /etc/hosts에 아래 항목 추가 필요 (최초 1회):
#   127.0.0.1  argocd.local airflow.local mlflow.local superset.local
#   127.0.0.1  grafana.local prometheus.local jenkins.local minio.local
#
# 추가 명령 (터미널에서 실행):
#   sudo sh -c 'echo "127.0.0.1 argocd.local airflow.local mlflow.local superset.local grafana.local prometheus.local jenkins.local minio.local" >> /etc/hosts'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
