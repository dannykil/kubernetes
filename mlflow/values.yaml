backendStore:
  databaseMigration: true
  databaseConnectionCheck: true
  postgres:
    enabled: true
    host: postgres-postgresql.postgres.svc.cluster.local
    port: 5432
    database: mlflow
    user: postgres
    password: postgres

# 차트에 포함된 PostgreSQL 은 쓰지 않는다. 공유 postgres 파드를 사용한다.
postgresql:
  enabled: false

artifactRoot:
  s3:
    enabled: true
    bucket: mlflow
    path: artifacts
    awsAccessKeyId: minioadmin
    awsSecretAccessKey: minioadmin123

extraEnvVars:
  MLFLOW_S3_ENDPOINT_URL: "http://minio.minio.svc.cluster.local:9000"

serviceMonitor:
  enabled: false
