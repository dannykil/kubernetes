# 서비스 목록. 한 줄이 명령 하나의 대상이다.
# 스크립트 로직은 이 파일을 읽기만 한다. 새 서비스는 줄을 추가한다.
#
# name|manifest|apps|needs|namespace|pvs
#   name       ./scripts/cluster.sh up/down 에 쓰는 이름
#   manifest   kubectl apply 할 Application 파일
#   apps       Argo CD Application 이름. 여러 개면 쉼표. 앞이 먼저 설치된다
#   needs      없을 때 먼저 올릴 서비스 이름. 없으면 -
#   namespace  down 할 때 지울 네임스페이스
#   pvs        down 할 때 claimRef 를 풀 PersistentVolume. 없으면 -
#
# storage PV 가 필요한 서비스의 needs 가 비어 있는 이유:
#   PV 는 up kind 의 storage Application 이 이미 만든다.
# Postgres 를 needs 에 적는 이유:
#   Postgres 는 파드가 뜨는 공유 데이터베이스라 up kind 에 넣지 않는다.

postgres|argocd/application-postgres.yaml|postgres-storage|-|postgres|postgres-pv
redis|argocd/application-redis.yaml|redis|-|redis|redis-pv
jenkins|argocd/application-jenkins.yaml|jenkins|-|jenkins|jenkins-pv
airflow|argocd/application-airflow.yaml|airflow|postgres|airflow|-
mlflow|argocd/application-mlflow.yaml|mlflow|postgres|mlflow|-
qdrant|argocd/application-qdrant.yaml|qdrant|-|qdrant|qdrant-pv
neo4j|argocd/application-neo4j.yaml|neo4j|-|neo4j|neo4j-pv
litellm|argocd/application-litellm.yaml|litellm|postgres,redis|litellm|-
# minio|argocd/application-minio.yaml|minio|-|minio|minio-pv
# prometheus|argocd/application-prometheus.yaml|prometheus|-|monitoring|prometheus-pv
# grafana|argocd/application-grafana.yaml|grafana|postgres|grafana|-
# superset|argocd/application-superset.yaml|superset|postgres|superset|-
# kafka|argocd/application-kafka.yaml|kafka-operator,kafka-cluster|-|kafka|kafka-pv,kafka-data-pv
# sample|argocd/application-sample.yaml|sample|-|sample|-
