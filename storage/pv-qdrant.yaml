apiVersion: v1
kind: PersistentVolume
metadata:
  name: qdrant-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage-local
  claimRef:
    namespace: qdrant
    name: qdrant-storage-qdrant-0
  local:
    path: /mnt/storage-data/qdrant
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: role
              operator: In
              values:
                - storage
